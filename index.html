<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Cockpit Boîtage — 13ᵉ Marseille</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#241813;--cream:#fbf3e6;--paper:#fffdf9;--terra:#d6552f;--terra-d:#a23c1d;--sun:#f0a500;--teal:#1c8b75;--line:#e4d6c0;--chaud:#df3f17;--tiede:#dd8c00;--froid:#62788a;--mut:#8a7868;--red:#a32d2d;--sh:0 8px 24px -12px rgba(60,30,15,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 14px 8px;z-index:1000;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:20px}.brand h1 em{font-style:italic;color:var(--terra)}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid;white-space:nowrap;flex:none}
.pill.ok{background:#e1f5ee;color:#0f6e56;border-color:#9fe1cb}
.pill.sync{background:#faeeda;color:#854f0b;border-color:#fac775}
.pill.fail{background:#fcebeb;color:var(--red);border-color:#f7c1c1}
.stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.stat b{font-family:'Fraunces',serif;color:var(--terra-d);margin-right:3px}
.srow{display:flex;gap:8px;margin-top:8px}
.search{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:13px;font-family:inherit;font-size:16px;min-height:48px}
.fbtn{border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:0 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:48px;touch-action:manipulation}
.fbtn.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.panel{max-height:0;overflow:hidden;transition:max-height .25s}.panel.open{max-height:240px}
.panelin{padding:9px 0 2px;display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--cream);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;user-select:none;touch-action:manipulation;min-height:44px;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}.chip.sun.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.sel{border:1.5px solid var(--line);background:var(--cream);border-radius:10px;padding:9px 10px;font-family:inherit;font-weight:700;font-size:13px}
#banner{display:none}
.bn{padding:10px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.bn.warn{background:#fcebeb;color:var(--red)}.bn.info{background:#fdf0d8;color:#8a5a00}
.bn button{margin-left:auto;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:9px;padding:6px 11px;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer}
.bn button.x{border:none;padding:6px 8px;font-size:15px;margin-left:4px}
.main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:block}.scr.pad{padding:12px}
#scr-carte{padding:0}#map{position:absolute;inset:0}
.legend{position:absolute;bottom:12px;left:12px;background:rgba(255,253,249,.95);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;z-index:600;box-shadow:var(--sh)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:3px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 12px 15px;margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.card.chaud::before{background:var(--chaud)}.card.tiede::before{background:var(--tiede)}.card.froid::before{background:var(--froid)}
.card.done{opacity:.55}
.rg{font-family:'Fraunces',serif;font-weight:900;font-size:15px;color:#cdbba6;min-width:16px;text-align:center;flex:none}
.mn{flex:1;min-width:0}
.ad{font-family:'Fraunces',serif;font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.tag.rdv{background:#e6f3ef;color:#10705a}.tag.rel{background:#fdeccf;color:#a5740a}.tag.bo{background:#efe7f5;color:#6b3f99}.tag.st{background:#f3e8d8;color:#6b5b4d}
.sc{font-family:'Fraunces',serif;font-weight:900;font-size:19px;color:var(--terra-d);min-width:26px;text-align:right;flex:none}
.qcol{display:flex;flex-direction:column;gap:5px;flex:none}
.qbtn{border:1.5px solid var(--line);background:var(--cream);border-radius:10px;width:48px;height:48px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;touch-action:manipulation}
.qbtn.in{background:var(--sun);border-color:var(--sun)}.qbtn.bo.on{background:#efe7f5;border-color:#c9aee6}
.nav{display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:none;background:none;padding:12px 0 10px;font-family:inherit;font-weight:700;font-size:11px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;touch-action:manipulation}
.nav button .ic{font-size:21px;line-height:1}.nav button.on{color:var(--terra)}
.nav .bdg{position:absolute;top:4px;right:50%;margin-right:-22px;background:var(--terra);color:#fff;border-radius:999px;min-width:17px;height:17px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sec{font-family:'Fraunces',serif;font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 2px 8px}.sec:first-child{margin-top:2px}
.big{width:100%;padding:15px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation;min-height:52px}
.big.ink{background:var(--ink);color:var(--cream)}.big.ghost{background:var(--cream);border:1.5px solid var(--line);color:var(--ink)}.big.terra{background:var(--terra)}
.block{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
.block h3{font-family:'Fraunces',serif;font-weight:900;font-size:15px;margin-bottom:10px}
.tourcard{background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.tourcard .tn{font-family:'Fraunces',serif;font-weight:900;font-size:15px}.tourcard .tmm{font-size:12px;color:var(--mut);margin-top:2px}
.trow{display:flex;gap:6px;margin-top:10px}.trow button{flex:1;border:1.5px solid var(--line);background:var(--cream);border-radius:9px;padding:12px 4px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;touch-action:manipulation;min-height:48px}
.titem{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--cream)}
.tnum{font-family:'Fraunces',serif;font-weight:900;color:#fff;background:var(--terra);border-radius:999px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.titem .ta{flex:1;font-size:13px;font-weight:600;line-height:1.2}.titem .ta small{color:var(--mut);font-weight:500}
.titem .rm{border:none;background:none;color:var(--terra-d);font-size:20px;cursor:pointer;padding:8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.modeseg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modeseg button{flex:1;border:none;background:var(--cream);padding:10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--mut)}.modeseg button.on{background:var(--teal);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hint{color:var(--mut);font-size:12px;margin-top:6px;line-height:1.45}
.fiche{position:absolute;inset:0;background:var(--cream);z-index:1500;transform:translateX(100%);transition:transform .26s;display:none;flex-direction:column}
.fiche.show{display:flex}.fiche.open{transform:translateX(0)}
.fhead{background:var(--paper);border-bottom:1px solid var(--line);padding:11px 13px}
.fbar{display:flex;align-items:center;gap:10px}
.back{border:1.5px solid var(--line);background:var(--cream);border-radius:10px;width:48px;height:48px;font-size:20px;cursor:pointer;flex:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.ftt{flex:1;min-width:0}.ftt h2{font-family:'Fraunces',serif;font-weight:900;font-size:18px;line-height:1.1}
.ftt .fq{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.fsc{font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:var(--terra-d);flex:none}
.copyaddr{margin-top:9px;border:1.5px solid var(--line);background:var(--cream);border-radius:9px;padding:12px 14px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;touch-action:manipulation;display:block;width:100%;text-align:left;min-height:48px}
.facts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.act{flex:1;min-width:70px;text-align:center;padding:13px 10px;border-radius:10px;font-weight:700;font-size:12px;border:none;font-family:inherit;cursor:pointer;text-decoration:none;touch-action:manipulation;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.act.map{background:var(--ink);color:#fff}.act.earth{background:#36617d;color:#fff}.act.ann{background:var(--terra);color:#fff}.act.tour{background:var(--teal);color:#fff}.act.tour.in{background:var(--sun);color:var(--ink)}
.fbody{flex:1;overflow-y:auto;padding:13px;-webkit-overflow-scrolling:touch}
.fld{margin-bottom:9px}.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:4px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--cream);border-radius:10px;padding:11px;font-family:inherit;font-size:16px}
textarea.inp{resize:vertical;min-height:42px}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
.callrow{display:flex;gap:7px;margin-top:4px}
.cb{flex:1;text-align:center;padding:14px;border-radius:10px;font-weight:700;font-size:13px;border:none;font-family:inherit;cursor:pointer;text-decoration:none;touch-action:manipulation;min-height:52px;display:inline-flex;align-items:center;justify-content:center}
.cb.tel{background:var(--teal);color:#fff}.cb.sms{background:#36617d;color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{flex:1;min-width:62px;border:1.5px solid var(--line);background:var(--cream);border-radius:9px;padding:12px 4px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;color:#7a6a5c;touch-action:manipulation;min-height:44px}
.seg button.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.note{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.note .nd{font-size:11px;color:var(--mut);font-weight:700;min-width:72px}.note .nx{font-size:13.5px;flex:1;word-break:break-word}
.note .ndel{border:none;background:none;color:var(--terra-d);cursor:pointer;font-size:16px;padding:6px 8px;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phc{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--cream)}
.phc img{width:100%;height:100%;object-fit:cover;display:block}
.phc .del{position:absolute;top:4px;right:4px;background:rgba(35,26,22,.75);color:#fff;border:none;border-radius:999px;width:24px;height:24px;cursor:pointer}
.phadd{aspect-ratio:1;border:2px dashed var(--terra);border-radius:11px;background:#fdeee9;color:var(--terra-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:12px;cursor:pointer}
.phadd input{display:none}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:800;z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--sh)}
.toast.show{opacity:1}
@media(min-width:760px){#scr-liste.pad{column-count:2;column-gap:10px}#scr-liste .card{break-inside:avoid}}
</style></head><body>
<div class="top">
 <div class="brand"><h1>Cockpit <em>Boîtage</em> · 13ᵉ</h1><span class="pill ok" id="status">✓ Sauvegardé</span></div>
 <div class="stats" id="stats"></div>
 <div class="srow" id="srow">
  <input class="search" id="q" placeholder="🔎 rue / quartier">
  <button class="fbtn" id="fbtn">⚙︎ Filtres</button>
 </div>
 <div class="panel" id="panel"><div class="panelin">
  <span class="chip" data-t="chaud">🔥</span><span class="chip" data-t="tiede">♨️</span><span class="chip" data-t="froid">🌡️</span>
  <span class="chip sun" id="cprio">⭐</span><span class="chip" id="cboite">📭 à boîter</span>
  <select class="sel" id="quart"></select>
  <select class="sel" id="sort"><option value="score">⇅ Score</option><option value="dpe">⇅ DPE récent</option><option value="quartier">⇅ Quartier</option></select>
 </div></div>
</div>
<div id="banner"></div>
<div class="main">
 <div class="scr on" id="scr-carte"><div id="map"></div>
  <div class="legend"><i style="background:var(--chaud)"></i>Chaud <i style="background:var(--tiede)"></i>Tiède <i style="background:var(--froid)"></i>Refroidi · ⭐ prio</div>
 </div>
 <div class="scr pad" id="scr-liste"></div>
 <div class="scr pad" id="scr-tournees"></div>
 <div class="scr pad" id="scr-donnees"></div>
</div>
<div class="nav" id="nav">
 <button class="on" data-s="carte"><span class="ic">🗺️</span>Carte</button>
 <button data-s="liste"><span class="ic">📋</span>Liste</button>
 <button data-s="tournees"><span class="ic">🧭</span>Tournées<span class="bdg" id="navbdg" style="display:none">0</span></button>
 <button data-s="donnees"><span class="ic">💾</span>Données</button>
</div>
<div class="fiche" id="fiche"></div>
<div class="toast" id="toast"></div>
<script>
const EXCLU=new Set(['Les Olives','Les Martégaux']);
const EMO={chaud:'🔥',tiede:'♨️',froid:'🌡️'},TC={chaud:'#df3f17',tiede:'#dd8c00',froid:'#62788a'};
const STAT=['À visiter','Visité','Contacté','RDV','Pas vendeur','Sous mandat','Vendu'];
function now(){return new Date().toISOString()}
function $(id){return document.getElementById(id)}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}
const mem={};let localBroken=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
 set(k,v){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;if(!localBroken){localBroken=true;renderBanner()}return false}},
 del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
let DATA=[],byId={},MAX=76;
let state={},tours=[],tour=[],tourU='',travelMode='bicycling',startPos=null,phIndex={},ficheOpen=null,firstDismissed=false;
let ft=new Set(),fq='all',prio=0,q='',fBoite=0,sortMode='score';
// ---- état + horodatage par enregistrement ----
function rec(id){let r=state[id];if(!r){r=state[id]={}}r.s=r.s||0;r.notes=r.notes||[];r.contact=r.contact||{};r.det=r.det||{};r.b=r.b||'';r.rdv=r.rdv||'';r.rel=r.rel||'';return r}
function touch(id){rec(id).u=now()}
function saveStateRaw(){return store.set('boitage13_v3',JSON.stringify(state))}
function saveToursRaw(){return store.set('boitage13_tours',JSON.stringify(tours))}
function saveTourRaw(){store.set('boitage13_tour',JSON.stringify(tour));store.set('boitage13_tourU',tourU)}
function saveState(){const ok=saveStateRaw();afterSave(ok)}
function saveTours(){const ok=saveToursRaw();afterSave(ok)}
function saveTour(){tourU=now();saveTourRaw();afterSave(true)}
function afterSave(localOk){if(sbUser){syncPush()}else{setStatus(localOk?'ok':'fail')}toast(localOk?'✓ Enregistré':'⚠️ Local plein — connecte-toi');if(!localOk)renderBanner()}
function setStatus(s){const e=$('status');if(!e)return;const m={ok:'✓ Sauvegardé',sync:'⏳ Synchro…',fail:'⚠️ Non sauvegardé'};e.textContent=m[s]||m.ok;e.className='pill '+(s||'ok')}
function load(){
 let raw=store.get('boitage13_v3');
 if(raw){try{state=JSON.parse(raw)}catch(e){}}
 else{let old=store.get('boitage13');if(old){try{const o=JSON.parse(old);for(const id in o){const v=o[id]||{};state[id]={s:v.s||0,b:v.b||'',rdv:'',rel:'',contact:{},det:{},notes:v.n?[{t:v.b||now(),x:v.n}]:[],u:now()}}}catch(e){}}}
 let t=store.get('boitage13_tours');if(t){try{tours=JSON.parse(t)}catch(e){}}
 let c=store.get('boitage13_tour');if(c){try{tour=JSON.parse(c)}catch(e){}}
 tourU=store.get('boitage13_tourU')||'';
 let m=store.get('boitage13_mode');if(m)travelMode=m;
 let p=store.get('boitage13_phidx');if(p){try{phIndex=JSON.parse(p)}catch(e){}}
 firstDismissed=store.get('boitage13_dismiss')==='1';
}
async function initData(){
 try{const r=await fetch('prospects.json',{cache:'no-store'});if(r.ok){const j=await r.json();const a=Array.isArray(j)?j:(j&&j.prospects);if(a&&a.length){DATA=a;store.set('boitage13_cache',JSON.stringify(a))}}}catch(e){}
 if(!DATA.length){const c=store.get('boitage13_cache');if(c){try{DATA=JSON.parse(c)}catch(e){}}}
 DATA=DATA.filter(p=>!EXCLU.has(p.q)).sort((a,b)=>b.score-a.score);DATA.forEach((p,i)=>p.rang=i+1);
 byId={};DATA.forEach(p=>byId[p.id]=p);MAX=Math.max(76,...DATA.map(p=>p.score||0));
}
// ---- bannière ----
function renderBanner(){const b=$('banner');let h='';
 if(localBroken)h='<div class="bn warn">⚠️ Sauvegarde locale saturée — vos saisies risquent de se perdre. Connectez-vous pour sauvegarder en ligne.<button onclick="nav(\'donnees\')">Activer</button></div>';
 else if(!sbUser&&!firstDismissed)h='<div class="bn info">🔒 Activez la sauvegarde cloud pour ne rien perdre (sur tous vos appareils).<button onclick="nav(\'donnees\')">Se connecter</button><button class="x" onclick="dismissFirst()">✕</button></div>';
 b.innerHTML=h;b.style.display=h?'block':'none'}
function dismissFirst(){firstDismissed=true;store.set('boitage13_dismiss','1');renderBanner()}
// ---- carte ----
let map,baseLayer,tourLayer;
function annURL(p){const rue=p.adresse.replace(/^\d+\s*/,'');return 'https://www.google.com/search?q='+encodeURIComponent('"'+rue+'" 13013 Marseille maison à vendre')}
function earthURL(p){return 'https://earth.google.com/web/@'+p.lat+','+p.lon+',120a,350d,35y,0h,45t,0r'}
function initMap(){map=L.map('map',{zoomControl:true}).setView([43.345,5.432],13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 baseLayer=L.layerGroup().addTo(map);tourLayer=L.layerGroup().addTo(map)}
function drawMap(d){if(!map)return;baseLayer.clearLayers();

 +'<div class="facts"><a class="act map" href="'+p.gmaps+'" target="_blank">📍 Maps</a><a class="act earth" href="'+earthURL(p)+'" target="_blank">🌍 Earth</a><a class="act ann" href="'+annURL(p)+'" target="_blank">🔗 Annonces</a><button class="act tour '+(inTour(id)?'in':'')+'" id="ftour" onclick="toggleTour(\''+id+'\')">'+(inTour(id)?'✓ Tournée':'＋ Tournée')+'</button></div></div>'
 +'<div class="fbody">'
 +'<div class="block"><h3>👤 Contact propriétaire</h3><div class="fld"><label>Nom</label><input class="inp" placeholder="ex. M. Martin" value="'+esc(r.contact.nom)+'" onchange="setC(\''+id+'\',\'nom\',this.value)"></div><div class="fld"><label>Téléphone</label><input class="inp" inputmode="tel" placeholder="06…" value="'+esc(r.contact.tel)+'" onchange="setC(\''+id+'\',\'tel\',this.value)"></div><div class="callrow"><a class="cb tel" href="'+(r.contact.tel?'tel:'+encodeURIComponent(r.contact.tel):'#')+'">📞 Appeler</a><a class="cb sms" href="'+(r.contact.tel?'sms:'+encodeURIComponent(r.contact.tel):'#')+'">💬 SMS</a></div><div class="fld" style="margin-top:9px"><label>E-mail</label><input class="inp" placeholder="@" value="'+esc(r.contact.email)+'" onchange="setC(\''+id+'\',\'email\',this.value)"></div></div>'
 +'<div class="block"><h3>📌 Suivi</h3><div class="seg">'+seg+'</div><div class="two" style="margin-top:11px"><div class="fld"><label>📅 RDV</label><input class="inp" type="date" value="'+esc(r.rdv)+'" onchange="setF(\''+id+'\',\'rdv\',this.value)"></div><div class="fld"><label>🔔 Relance</label><input class="inp" type="date" value="'+esc(r.rel)+'" onchange="setF(\''+id+'\',\'rel\',this.value)"></div></div><div id="boitebox">'+boiteHTML(id)+'</div></div>'
 +'<div class="block"><h3>🏠 Détails du bien / visite</h3><div class="two"><div class="fld"><label>Prix estimé</label><input class="inp" placeholder="€" value="'+esc(r.det.prix)+'" onchange="setD(\''+id+'\',\'prix\',this.value)"></div><div class="fld"><label>Type</label><input class="inp" placeholder="Maison T4" value="'+esc(r.det.type)+'" onchange="setD(\''+id+'\',\'type\',this.value)"></div></div><div class="fld"><label>État</label><input class="inp" placeholder="Bon / à rafraîchir…" value="'+esc(r.det.etat)+'" onchange="setD(\''+id+'\',\'etat\',this.value)"></div><div class="fld"><label>Observations</label><textarea class="inp" rows="2" onchange="setD(\''+id+'\',\'obs\',this.value)">'+esc(r.det.obs)+'</textarea></div></div>'
 +'<div class="block"><h3>📝 Notes (horodatées)</h3><div style="display:flex;gap:7px"><input class="inp" id="newnote" placeholder="Note de passage…"><button class="cb tel" style="flex:none;width:48px;height:52px;min-height:52px" onclick="addNote(\''+id+'\')">+</button></div><div id="notes" style="margin-top:6px">'+notesHTML(id)+'</div></div>'
 +'<div class="block"><h3>📷 Photos</h3><div class="phgrid" id="phgrid"></div></div>'
 +'<div class="block"><h3>📄 Diagnostic</h3><div class="mt" style="white-space:normal;font-size:13px;color:var(--ink)">DPE '+p.dpe+' / GES '+p.ges+' · '+p.surface+' m²'+(p.niv?' · '+p.niv+' niv.':'')+(p.annee?' · '+p.annee:'')+'<br>Conso '+(p.conso||'?')+' kWh · '+(p.gesv||'?')+' kg/m²/an · '+esc(p.chauf||'')+'<br>DPE J-'+p.jours+' · '+esc(p.statut)+'</div></div>'
 +'</div>';
 const fd=$('fiche');fd.classList.add('show');requestAnimationFrame(()=>fd.classList.add('open'));renderPhotos(id);bindFicheInputs(id)}
function closeFiche(){saveState();const fd=$('fiche');fd.classList.remove('open');ficheOpen=null;setTimeout(()=>fd.classList.remove('show'),260);refresh()}
function syncFicheTour(){const b=$('ftour');if(b){const on=inTour(ficheOpen);b.classList.toggle('in',on);b.textContent=on?'✓ Tournée':'＋ Tournée'}}
function setS(id,k){rec(id).s=k;touch(id);saveState();document.querySelectorAll('#fiche .seg button').forEach((b,i)=>b.classList.toggle('on',i===k))}
function setC(id,k,v){rec(id).contact[k]=v;touch(id);saveState()}
function setD(id,k,v){rec(id).det[k]=v;touch(id);saveState()}
function setF(id,k,v){rec(id)[k]=v;touch(id);saveState()}
// sauvegarde défensive sur tout input/textarea de la fiche
function bindFicheInputs(id){
  document.querySelectorAll('#fiche .inp').forEach(el=>{
    el.addEventListener('blur',()=>{
      // s'assure que la dernière valeur est bien persistée
      saveState();
    });
  });
}
function copyAddr(id,b){const p=byId[id];const t=p.adresse+' 13013 Marseille';const o=b.innerHTML;navigator.clipboard.writeText(t).then(()=>{b.innerHTML='✓ Copié !';setTimeout(()=>b.innerHTML=o,1300)}).catch(()=>{b.innerHTML='⚠';setTimeout(()=>b.innerHTML=o,1300)})}
function notesHTML(id){const r=rec(id);return r.notes.map((n,i)=>'<div class="note"><span class="nd">'+fdt(n.t)+'</span><span class="nx">'+esc(n.x)+'</span><button class="ndel" onclick="delNote(\''+id+'\','+i+')">🗑️</button></div>').join('')||'<p class="hint" style="margin:4px 0">Aucune note.</p>'}
function fdt(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+'h'+p(d.getMinutes())}
function addNote(id){const el=$('newnote'),v=el.value.trim();if(!v)return;rec(id).notes.unshift({t:now(),x:v});touch(id);saveState();el.value='';$('notes').innerHTML=notesHTML(id)}
function delNote(id,i){rec(id).notes.splice(i,1);touch(id);saveState();$('notes').innerHTML=notesHTML(id)}
function boiteHTML(id){const b=rec(id).b;return b?'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#efe7f5;border:1px solid #ddcdec;border-radius:11px;padding:10px 11px;font-size:13.5px;font-weight:600;color:#6b3f99">📭 Boîté le <b>'+fmtBoite(b)+'</b><button class="qbtn" style="width:auto;padding:6px 10px;font-size:12px" onclick="setBoite(\''+id+'\')">↻</button><button class="qbtn" style="width:auto;padding:6px 10px;font-size:12px;color:var(--terra-d)" onclick="clearBoite(\''+id+'\')">✕</button></div>':'<button class="big" style="background:#6b3f99" onclick="setBoite(\''+id+'\')">📭 Marquer « boîté » maintenant</button>'}
function fmtBoite(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' à '+p(d.getHours())+'h'+p(d.getMinutes())}
function setBoite(id){rec(id).b=now();touch(id);saveState();if($('boitebox'))$('boitebox').innerHTML=boiteHTML(id);refresh();toast('📭 Boîté ✓')}
function clearBoite(id){rec(id).b='';touch(id);saveState();if($('boitebox'))$('boitebox').innerHTML=boiteHTML(id);refresh()}
// ---- données / export-import ----
function renderDonnees(){let h='<div class="sec">Sauvegarde cloud</div>'+sbBlockHTML();
 let nn=0;for(const id in state)nn+=(state[id].notes||[]).length;let ph=0;for(const id in phIndex)ph+=phIndex[id]||0;
 h+='<div class="sec">Sauvegarde fichier</div><div class="block"><button class="big ink" onclick="exportData()">⬇️ Exporter mes saisies</button><label class="big ghost" style="display:block;text-align:center;margin-top:8px;cursor:pointer">⬆️ Importer une sauvegarde<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label><p class="hint">'+nn+' note(s) · '+ph+' photo(s) · '+tours.filter(t=>!t.deleted).length+' tournée(s). Les photos sont stockées en local (IndexedDB) — incluses dans l\'export.</p></div>';
 $('scr-donnees').innerHTML=h}
async function exportData(){toast('Préparation…');const photos=await idbAll();const o={v:4,date:now(),state,tours,tour,tourU,mode:travelMode,phIndex,photos};const blob=new Blob([JSON.stringify(o)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='boitage13-sauvegarde-'+now().slice(0,10)+'.json';a.click();toast('Export prêt ✓')}
function importData(input){const f=input.files&&input.files[0];if(!f)return;const fr=new FileReader();fr.onload=async()=>{try{const o=JSON.parse(fr.result);if(o.state){state=mergeRecs(state,o.state);saveStateRaw()}if(o.tours){tours=mergeTours(tours,o.tours);saveToursRaw()}if(o.tour&&(!tourU||(o.tourU||'')>tourU)){tour=o.tour;tourU=o.tourU||now();saveTourRaw()}if(o.mode){travelMode=o.mode;store.set('boitage13_mode',o.mode)}if(o.phIndex){phIndex=o.phIndex;store.set('boitage13_phidx',JSON.stringify(phIndex))}if(o.photos){for(const k in o.photos)await idbSet(k,o.photos[k])}if(sbUser)syncPush();refresh();renderDonnees();toast('Sauvegarde importée ✓')}catch(e){alert('Fichier invalide.')}};fr.readAsText(f)}
// ---- navigation / refresh ----
function refresh(){const d=filtered();drawList(d);drawMap(d);updateStats();if($('scr-tournees').classList.contains('on'))renderTours();else{const n=tour.length;$('navbdg').style.display=n?'flex':'none';$('navbdg').textContent=n}if($('scr-donnees').classList.contains('on'))renderDonnees()}
function nav(s){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$('scr-'+s).classList.add('on');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));$('srow').style.display=(s==='carte'||s==='liste')?'flex':'none';if($('panel').classList.contains('open')){$('panel').classList.remove('open');$('fbtn').classList.remove('on')}if(s==='carte')setTimeout(()=>{map&&map.invalidateSize()},120);if(s==='tournees')renderTours();if(s==='donnees')renderDonnees()}
$('fbtn').onclick=function(){$('panel').classList.toggle('open');this.classList.toggle('on')};
$('q').oninput=e=>{q=e.target.value.trim().toLowerCase();drawList(filtered());drawMap(filtered())};
document.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{const t=c.dataset.t;c.classList.toggle('on');ft.has(t)?ft.delete(t):ft.add(t);refresh()});
$('cprio').onclick=function(){prio=prio?0:1;this.classList.toggle('on');refresh()};
$('cboite').onclick=function(){fBoite=fBoite?0:1;this.classList.toggle('on');refresh()};
$('quart').onchange=e=>{fq=e.target.value;refresh()};
$('sort').onchange=e=>{sortMode=e.target.value;refresh()};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>nav(b.dataset.s));
// sauvegarde quand l'app passe en arrière-plan (mobile)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){saveStateRaw();saveToursRaw();saveTourRaw();if(sbUser)syncPush(true)}});
window.addEventListener('pagehide',()=>{saveStateRaw();saveToursRaw();saveTourRaw()});
// boot
load();renderBanner();initMap();sbInit();migratePhotos();initData().then(()=>{populateQuartiers();refresh();setStatus('ok');setTimeout(()=>map&&map.invalidateSize(),200)});
</script></body></html>
