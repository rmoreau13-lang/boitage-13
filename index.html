<style>
:root{--ink:#231a16;--cream:#fdf6ec;--paper:#fffaf2;--terra:#e07a5f;--terra-d:#c25c43;--sun:#f2b705;--teal:#2a9d8f;--line:#e7d8c4;--chaud:#e8503a;--tiede:#e9a319;--froid:#7d93a3;--shadow:0 8px 24px -12px rgba(60,30,15,.4)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'Hanken Grotesk',sans-serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
.top{padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:1000}
.title{font-family:'Fraunces',serif;font-weight:900;font-size:20px;line-height:1}

.stats{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.stat b{font-family:'Fraunces',serif;color:var(--terra-d);margin-right:3px}
.bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:140px;padding:8px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:var(--cream)}
.sel{padding:7px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--cream);font-family:inherit;font-weight:600;font-size:12px}
.chip{border:1.5px solid var(--line);background:var(--cream);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}.chip.star.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.toggle{display:flex;background:var(--cream);border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.toggle button{border:none;background:none;padding:7px 14px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:#8a7a6c}
.toggle button.on{background:var(--terra);color:#fff}
.main{flex:1;position:relative;overflow:hidden}
#map{position:absolute;inset:0}
.list{position:absolute;inset:0;overflow-y:auto;padding:12px;display:none;grid-template-columns:1fr;gap:9px;background:var(--cream)}
@media(min-width:980px){.list{grid-template-columns:1fr 1fr}}
body.listview .list{display:grid}body.listview #map{display:none}
body.splitview #map{display:block;top:0;bottom:auto;left:0;right:0;height:44%;box-shadow:0 6px 14px -8px rgba(60,30,15,.45)}
body.splitview .list{display:grid;grid-template-columns:1fr;top:44%;bottom:0;left:0;right:0}
body.splitview .totop.show{display:flex}
.row{display:flex;align-items:center;gap:11px;background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px 12px 15px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--froid)}
.row.prio::before{background:linear-gradient(var(--sun),var(--terra))}
.row.done{opacity:.5}
.row:hover{border-color:var(--terra)}
.rrang{font-family:'Fraunces',serif;font-weight:900;font-size:15px;color:#cdbba6;min-width:20px;text-align:center;flex:none;margin-left:3px}
.rdot{width:11px;height:11px;border-radius:99px;flex:none}
.rdot.chaud{background:var(--chaud)}.rdot.tiede{background:var(--tiede)}.rdot.froid{background:var(--froid)}
.rmain{flex:1;min-width:0}
.raddr{font-family:'Fraunces',serif;font-weight:700;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:11.5px;color:#8a7a6c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.rscore{font-family:'Fraunces',serif;font-weight:900;font-size:19px;color:var(--terra-d);min-width:30px;text-align:right;flex:none}
.rq{display:flex;gap:5px;flex:none}
.qb{border:1.5px solid var(--line);background:var(--cream);border-radius:9px;padding:8px 11px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;color:var(--ink);line-height:1}
.qb.add.in{background:var(--sun);border-color:var(--sun)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:15px;padding:13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--froid)}
.card.prio::before{background:linear-gradient(var(--sun),var(--terra))}
.card.done{opacity:.55}
.chead{display:flex;gap:8px;align-items:flex-start}
.rang{font-family:'Fraunces',serif;font-weight:900;font-size:16px;color:#cdbba6;min-width:24px}
.addr{font-family:'Fraunces',serif;font-weight:700;font-size:15px;line-height:1.12;flex:1}
.qt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9a8a7c;margin-top:2px}
.sc{font-family:'Fraunces',serif;font-weight:900;font-size:20px;text-align:center;min-width:34px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:#f3e8d8;color:#6b5b4d}
.tag.d{background:#e6f3ef;color:#1f7a6e}.tag.j{background:#fdeccf;color:#a5740a}
.tb{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:6px;color:#fff}
.tb.chaud{background:var(--chaud)}.tb.tiede{background:var(--tiede)}.tb.froid{background:var(--froid)}
.seg{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:54px;border:1.5px solid var(--line);background:var(--cream);border-radius:8px;padding:5px 4px;font-size:10.5px;font-weight:700;font-family:inherit;cursor:pointer;color:#7a6a5c}
.seg button.on{color:#fff;border-color:transparent}
.seg button.s0.on{background:var(--froid)}.seg button.s1.on{background:var(--teal)}.seg button.s2.on{background:#3d6e8f}.seg button.s3.on{background:var(--terra)}.seg button.s4.on{background:#9a8a7c}.seg button.s5.on{background:#9c6ab5}.seg button.s6.on{background:#2f6b3d}
.note{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:9px;padding:7px;font-family:inherit;font-size:12.5px;background:var(--cream);resize:vertical;min-height:34px}
.acts{display:flex;gap:6px;margin-top:9px}
.btn{flex:1;text-align:center;padding:8px;border-radius:9px;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer;border:none;font-family:inherit}
.btn.map{background:var(--ink);color:var(--cream)}.btn.ann{background:var(--terra);color:#fff}.btn.cp{flex:0 0 auto;background:var(--cream);border:1.5px solid var(--line);color:var(--ink);padding:8px 11px}
.leaflet-popup-content{margin:11px 13px;font-family:'Hanken Grotesk',sans-serif}
.pp-addr{font-family:'Fraunces',serif;font-weight:700;font-size:15px;margin-bottom:3px}
.pp-meta{font-size:12px;color:#6b5b4d;margin-bottom:7px}
.pp a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:700;margin-right:5px}
.pp a.ann{background:var(--terra)}
.legend{position:absolute;bottom:12px;left:12px;background:rgba(255,250,242,.95);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;z-index:600;box-shadow:var(--shadow)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:8px}
.dot{width:10px;height:10px;border-radius:99px;display:inline-block}
.btn.add{background:var(--teal);color:#fff}.btn.add.in{background:var(--sun);color:var(--ink)}
.fab{position:absolute;right:14px;bottom:14px;z-index:700;background:var(--ink);color:var(--cream);border:none;border-radius:999px;padding:13px 18px;font-family:'Fraunces',serif;font-weight:900;font-size:15px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab .bdg{background:var(--sun);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:900;background:var(--paper);border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:0 -10px 30px -10px rgba(60,30,15,.4);transform:translateY(110%);transition:transform .3s;max-height:75%;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.shead{padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.shead .t{font-family:'Fraunces',serif;font-weight:900;font-size:18px}
.shead .d{font-size:12.5px;color:#8a7a6c;margin-top:2px}
.sclose{position:absolute;right:14px;top:12px;border:none;background:var(--cream);border-radius:999px;width:30px;height:30px;font-size:16px;cursor:pointer}
.tlist{overflow-y:auto;padding:8px 12px;flex:1}
.titem{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:var(--cream)}
.tnum{font-family:'Fraunces',serif;font-weight:900;font-size:15px;color:#fff;background:var(--terra);border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none}
.titem .ta{flex:1;font-weight:600;font-size:13.5px;line-height:1.2}.titem .ta small{color:#9a8a7c;font-weight:500}
.titem .rm{border:none;background:none;color:var(--terra-d);font-size:18px;cursor:pointer}
.sfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sfoot .opt{padding:9px 12px;border:1.5px solid var(--line);background:var(--cream);border-radius:10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.sfoot .go{flex:1;min-width:160px;padding:11px;border:none;border-radius:10px;background:var(--terra);color:#fff;font-family:inherit;font-weight:700;font-size:14px;text-decoration:none;text-align:center;cursor:pointer}
.sfoot .km{font-family:'Fraunces',serif;font-weight:700;color:var(--terra-d)}
.tnumicon{background:var(--terra);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.modeseg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modeseg button{border:none;background:var(--cream);padding:9px 12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:#8a7a6c}
.modeseg button.on{background:var(--teal);color:#fff}
.phb{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 7px}
.modal{position:fixed;inset:0;z-index:2000;background:rgba(35,26,22,.55);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.fiche{background:var(--paper);width:100%;max-width:560px;max-height:92%;border-top-left-radius:22px;border-top-right-radius:22px;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
@media(min-width:560px){.modal{align-items:center}.fiche{border-radius:22px}}
.fhead{position:sticky;top:0;background:var(--paper);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.fhead .fa{flex:1}.fhead .fa h2{font-family:'Fraunces',serif;font-weight:900;font-size:21px;line-height:1.08}
.fhead .fa .fq{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9a8a7c;margin-top:3px}
.fhead .fsc{font-family:'Fraunces',serif;font-weight:900;font-size:26px;color:var(--terra-d);text-align:center}
.fclose{position:absolute;right:14px;top:13px;border:none;background:var(--cream);border-radius:999px;width:32px;height:32px;font-size:17px;cursor:pointer}
.fbody{padding:14px 18px 22px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.fg{background:var(--cream);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.fg .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#a89684;font-weight:700}
.fg .v{font-family:'Fraunces',serif;font-weight:700;font-size:16px;margin-top:2px}
.fg.fp{background:#eaf2f8;border-color:#cfe0ec}
.fsec{font-family:'Fraunces',serif;font-weight:700;font-size:15px;margin:16px 0 8px}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phc{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--cream)}
.phc img{width:100%;height:100%;object-fit:cover;display:block}

.phadd{aspect-ratio:1;border:2px dashed var(--terra);border-radius:11px;background:#fdeee9;color:var(--terra-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12px;cursor:pointer}
.phadd input{display:none}
.facts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.facts a,.facts button{flex:1;min-width:90px;text-align:center;padding:11px;border-radius:11px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;border:none;font-family:inherit}

 .top{padding:8px 10px}

}

let DATA=FALLBACK_DATA, MAX=76;
const EXCLU=new Set(['Les Olives','Les Martégaux']); // quartiers exclus du boîtage
const EMO={chaud:'🔥',tiede:'♨️',froid:'🌡️'}, TC={chaud:'#e8503a',tiede:'#e9a319',froid:'#7d93a3'};
const STAT=['À visiter','Visité','Contacté','RDV','Pas vendeur','Déjà sous mandat','Vendu'];
const mem={};
const store={async get(k){try{if(window.storage){const r=await window.storage.get(k);return r?r.value:null}}catch(e){} try{return localStorage.getItem(k)}catch(e){} return mem[k]??null},
 async set(k,v){try{if(window.storage){await window.storage.set(k,v);return}}catch(e){} try{localStorage.setItem(k,v);return}catch(e){} mem[k]=v}};
let state={}; // id -> {s:statusIndex, n:note}
let ft=new Set(), fq='all', prio=0, q='', fBoite=0, sortMode='score';
let byId={};
let tour=[]; // ordered ids
let startPos=null; // {lat,lon} optional
let travelMode='bicycling';
let ficheOpen=null;
let phIndex={};

async function load(){try{const raw=await store.get('boitage13');if(raw)state=JSON.parse(raw)}catch(e){} try{const t=await store.get('boitage13_tour');if(t)tour=JSON.parse(t)}catch(e){} try{const m=await store.get('boitage13_mode');if(m)travelMode=m}catch(e){} try{const p=await store.get('boitage13_phidx');if(p)phIndex=JSON.parse(p)}catch(e){}}
async function save(){try{await store.set('boitage13',JSON.stringify(state))}catch(e){}}
async function saveTour(){try{await store.set('boitage13_tour',JSON.stringify(tour))}catch(e){}}
function st(id){return state[id]||{s:0,n:'',b:''}}

// map
const map=L.map('map',{zoomControl:true}).setView([43.345,5.432],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let markers=[];
const baseLayer=L.layerGroup().addTo(map);
const tourLayer=L.layerGroup().addTo(map);
function annURL(p){const rue=p.adresse.replace(/^\d+\s*/,'');return 'https://www.google.com/search?q='+encodeURIComponent('"'+rue+'" 13013 Marseille maison à vendre')}
function earthURL(p){return 'https://earth.google.com/web/@'+p.lat+','+p.lon+',120a,350d,35y,0h,45t,0r'}
function drawMap(d){
 baseLayer.clearLayers();markers=[];
 d.forEach(p=>{if(p.lat==null)return;
  const done=st(p.id).s>0;
  const m=L.circleMarker([p.lat,p.lon],{radius:6+p.score/MAX*8,fillColor:TC[p.tier],color:p.prio?'#f2b705':'#fff',weight:p.prio?3:1.5,fillOpacity:done?.35:.9});
  m.bindPopup(`<div class="pp"><div class="pp-addr">${p.prio?'⭐ ':''}${p.adresse}</div>
   <div class="pp-meta">${p.q} · ${EMO[p.tier]} DPE ${p.dpe}/${p.ges} · ${p.surface} m² · J-${p.jours} · score ${p.score}<br>empreinte: ${p.conso||'?'} kWh · ${p.gesv||'?'} kg</div>
   <a href="${p.gmaps}" target="_blank">📍 Itinéraire</a><a href="${earthURL(p)}" target="_blank">🌍 Earth</a><a class="ann" href="${annURL(p)}" target="_blank">🔗 Annonces</a>
   <a href="#" onclick="toggleTour('${p.id}');return false">${inTour(p.id)?'✓ Dans la tournée':'＋ Tournée'}</a> <a href="#" onclick="openFiche('${p.id}');return false">📋 Fiche</a></div>`);
  m.addTo(baseLayer);markers.push(m)});
}
// list
const list=document.getElementById('list');
function drawList(d){
 list.innerHTML=d.map(p=>{const s=st(p.id);const stxt=s.s>0?' · '+STAT[s.s]:'';
  return `<div class="row ${p.prio?'prio':''} ${s.s>0?'done':''}" onclick="openFiche('${p.id}')">
   <span class="rrang">${p.rang}</span><span class="rdot ${p.tier}"></span>
   <div class="rmain"><div class="raddr">${p.prio?'\u2b50 ':''}${p.adresse}${phIndex[p.id]?' \ud83d\udcf7':''}${st(p.id).b?' \ud83d\udced':''}</div>
    <div class="rsub">${p.q} \u00b7 DPE ${p.dpe}/${p.ges} \u00b7 ${p.surface} m\u00b2 \u00b7 J-${p.jours}${stxt}${p.qoff&&p.qoff!==p.q?' · 🏛 '+p.qoff:''}</div></div>
   <div class="rscore">${p.score}</div>
   <div class="rq" onclick="event.stopPropagation()"><button class="qb add ${inTour(p.id)?'in':''}" onclick="toggleTour('${p.id}')">${inTour(p.id)?'\u2713':'\uff0b'}</button><a class="qb" href="${p.gmaps}" target="_blank">📍</a></div>
  </div>`}).join('')||'<div style="padding:30px;text-align:center;color:#9a8a7c">Aucun prospect 🤷</div>';
}
function cp(b,t){navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;b.textContent='✓';setTimeout(()=>b.textContent=o,1000)})}
function copyAddr(id,b){const p=byId[id];if(!p)return;const t=p.adresse+' 13013 Marseille';const o=b.innerHTML;navigator.clipboard.writeText(t).then(()=>{b.innerHTML='✓ Copié !';setTimeout(()=>b.innerHTML=o,1300)}).catch(()=>{b.innerHTML='⚠ échec';setTimeout(()=>b.innerHTML=o,1300)})}
function setS(id,k){const c=st(id);state[id]={s:k,n:c.n,b:c.b};save();refresh();
 if(ficheOpen===id){const sel=k;document.querySelectorAll('#fiche .seg button').forEach((b,i)=>b.classList.toggle('on',i===sel))}}
function setN(id,v){const c=st(id);state[id]={s:c.s,n:v,b:c.b};save();updateTodo()}
// ---- BOÎTÉ (horodaté) ----
function fmtBoite(iso){const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' à '+p(d.getHours())+'h'+p(d.getMinutes())}
function boiteHTML(id){const b=st(id).b;return b?`<div class="boited">📭 Boîté le <b>${fmtBoite(b)}</b><button class="bbtn" onclick="setBoite('${id}')">↻ Refaire</button><button class="bbtn x" onclick="clearBoite('${id}')">✕</button></div>`:`<button class="bbtn go" onclick="setBoite('${id}')">📭 Marquer « boîté » maintenant</button>`}
function refreshBoite(id){const el=document.getElementById('boitebox');if(el)el.innerHTML=boiteHTML(id)}
function setBoite(id){const c=st(id);state[id]={s:c.s,n:c.n,b:new Date().toISOString()};save();refreshBoite(id);updateStats();drawMap(filtered());drawList(filtered())}
function clearBoite(id){const c=st(id);state[id]={s:c.s,n:c.n,b:''};save();refreshBoite(id);updateStats();drawMap(filtered());drawList(filtered())}
function updateTodo(){const todo=DATA.filter(p=>st(p.id).s==0).length;document.getElementById('todo').innerHTML='<b>'+todo+'</b>à visiter'}
function filtered(){let d=DATA.filter(p=>(ft.size==0||ft.has(p.tier))&&(fq=='all'||p.q==fq||p.qoff===fq)&&(!prio||p.prio)&&(!fBoite||!st(p.id).b)&&(!q||p.adresse.toLowerCase().includes(q)||p.q.toLowerCase().includes(q)||(p.qoff||'').toLowerCase().includes(q)));
 if(sortMode==='dpe')d=d.slice().sort((a,b)=>a.jours-b.jours);
 else if(sortMode==='quartier')d=d.slice().sort((a,b)=>(a.q||'').localeCompare(b.q||'','fr')||b.score-a.score);
 else d=d.slice().sort((a,b)=>b.score-a.score);
 return d;}

// ---- TOURNÉE ----
function inTour(id){return tour.includes(id)}
function toggleTour(id){const i=tour.indexOf(id);if(i<0)tour.push(id);else tour.splice(i,1);saveTour();refresh();
 if(ficheOpen){const b=document.querySelector('#fiche .add');if(b){const on=inTour(ficheOpen);b.classList.toggle('in',on);b.textContent=on?'✓ Tournée':'＋ Tournée'}}}
function tourStops(){return tour.map(id=>byId[id]).filter(Boolean)}
function dist(a,b){const R=6371,r=Math.PI/180,dla=(b.lat-a.lat)*r,dlo=(b.lon-a.lon)*r,la1=a.lat*r,la2=b.lat*r;
 const h=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function tourKm(){const s=tourStops();let pts=startPos?[startPos,...s]:s,d=0;for(let i=1;i<pts.length;i++)d+=dist(pts[i-1],pts[i]);return d}
function optimize(){let s=tourStops();if(s.length<2)return;
 let cur=startPos||s[0],pool=startPos?[...s]:s.slice(1),ordered=startPos?[]:[s[0]];
 while(pool.length){let bi=0,bd=1e9;pool.forEach((p,i)=>{const d=dist(cur,p);if(d<bd){bd=d;bi=i}});cur=pool[bi];ordered.push(cur);pool.splice(bi,1)}
 tour=ordered.map(p=>p.id);saveTour();refresh();fitTour()}
function mapsUrl(){const s=tourStops();if(s.length<1)return '#';
 let pts=startPos?[startPos,...s]:s;if(pts.length<2)return 'https://www.google.com/maps/dir/?api=1&destination='+pts[0].lat+','+pts[0].lon+'&travelmode='+travelMode;
 const o=pts[0],d=pts[pts.length-1],wp=pts.slice(1,-1).map(p=>p.lat+','+p.lon).join('|');
 let u='https://www.google.com/maps/dir/?api=1&travelmode='+travelMode+'&origin='+o.lat+','+o.lon+'&destination='+d.lat+','+d.lon;
 if(wp)u+='&waypoints='+encodeURIComponent(wp);return u}
function fitTour(){const s=tourStops();if(!s.length)return;const ll=s.map(p=>[p.lat,p.lon]);if(startPos)ll.unshift([startPos.lat,startPos.lon]);
 if(!document.body.classList.contains('listview'))map.fitBounds(ll,{padding:[50,50],maxZoom:15})}
function drawTour(){tourLayer.clearLayers();const s=tourStops();if(!s.length)return;
 let pts=startPos?[startPos,...s]:s;const ll=pts.map(p=>[p.lat,p.lon]);
 L.polyline(ll,{color:'#e07a5f',weight:4,opacity:.85,dashArray:'7 7'}).addTo(tourLayer);
 if(startPos)L.circleMarker([startPos.lat,startPos.lon],{radius:7,fillColor:'#2a9d8f',color:'#fff',weight:2,fillOpacity:1}).bindTooltip('Départ').addTo(tourLayer);
 s.forEach((p,i)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div class="tnumicon">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(tourLayer))}
function renderSheet(){const s=tourStops();
 document.getElementById('fabn').textContent=tour.length;
 document.getElementById('tdesc').textContent=s.length?(s.length+' arrêt'+(s.length>1?'s':'')+(startPos?' · départ : ma position':'')):'Ajoute des adresses depuis la carte ou la liste.';
 document.getElementById('tkm').textContent=s.length>=1?('≈ '+tourKm().toFixed(1)+' km'):'';
 document.getElementById('gomaps').href=mapsUrl();
 document.getElementById('tlist').innerHTML=s.length?s.map((p,i)=>`<div class="titem"><span class="tnum">${i+1}</span><div class="ta">${p.adresse}<br><small>${p.q} · ${EMO[p.tier]} ${p.dpe} · ${p.surface} m²</small></div><button class="rm" onclick="toggleTour('${p.id}')">✕</button></div>`).join(''):'<div style="padding:24px;text-align:center;color:#9a8a7c">Tournée vide.</div>';
}
function downscale(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',0.6))}catch(e){cb(fr.result)}};img.src=fr.result};fr.readAsDataURL(file)}
async function getPhotos(id){try{const r=await store.get('ph_'+id);return r?JSON.parse(r):[]}catch(e){return[]}}
async function setPhotos(id,arr){try{await store.set('ph_'+id,JSON.stringify(arr))}catch(e){alert('Stockage plein : réduis le nombre de photos.')}phIndex[id]=arr.length;try{await store.set('boitage13_phidx',JSON.stringify(phIndex))}catch(e){}}
function addPhoto(id,input){const f=input.files&&input.files[0];if(!f)return;downscale(f,async url=>{const arr=await getPhotos(id);arr.push(url);await setPhotos(id,arr);renderPhotos(id);drawMap(filtered());drawList(filtered())})}
async function delPhoto(id,i){const arr=await getPhotos(id);arr.splice(i,1);await setPhotos(id,arr);renderPhotos(id);drawMap(filtered());drawList(filtered())}
async function renderPhotos(id){const el=document.getElementById('phgrid');if(!el)return;const arr=await getPhotos(id);
 el.innerHTML=arr.map((u,i)=>`<div class="phc"><img src="${u}"><button class="del" onclick="delPhoto('${id}',${i})">✕</button></div>`).join('')+`<label class="phadd">📷<span>Ajouter</span><input type="file" accept="image/*" capture="environment" onchange="addPhoto('${id}',this)"></label>`}
function openFiche(id){ficheOpen=id;const p=byId[id];const s=st(id);
 const segs=STAT.map((t,k)=>`<button class="s${k} ${s.s==k?'on':''}" onclick="setS('${id}',${k})">${t}</button>`).join('');
 const g=(k,v,fp)=>`<div class="fg ${fp?'fp':''}"><div class="k">${k}</div><div class="v">${(v==null||v==='')?'—':v}</div></div>`;
 document.getElementById('fiche').innerHTML=`
  <div class="fhead"><div class="fa"><h2>${p.adresse}</h2><div class="fq">${p.prio?'⭐ ':''}${p.q} · <span class="tb ${p.tier}">${EMO[p.tier]} ${p.tier}</span></div><button class="copyaddr" onclick="event.stopPropagation();copyAddr('${id}',this)">📋 Copier l'adresse</button></div>
   <div class="fsc">${p.score}<div style="font-size:9px;letter-spacing:.1em;color:#b0a08f;text-transform:uppercase">score</div></div>
   <button class="fclose" onclick="closeFiche()">✕</button></div>
  <div class="fbody">
   <div class="fgrid">${g('Classe DPE',p.dpe)}${g('Classe GES',p.ges)}${g('Surface',p.surface+' m²')}${g('Niveaux',p.niv)}${g('Conso',(p.conso||'?')+' kWh/m²/an',1)}${g('Émissions',(p.gesv||'?')+' kg/m²/an',1)}${g('Année',p.annee)}${g('Chauffage',p.chauf)}${g('Fraîcheur DPE','J-'+p.jours)}${g('Quartier officiel',p.qoff)}${g('Annonce',p.statut)}</div>
   <div class="fsec">Suivi</div>
   <div class="seg">${segs}</div>
   <textarea class="note" placeholder="Note terrain…" onchange="setN('${id}',this.value)">${s.n||''}</textarea>
   <div class="fsec">📭 Boîtage</div>
   <div id="boitebox">${boiteHTML(id)}</div>
   <div class="fsec">📷 Photos du boîtage</div>
   <div class="phgrid" id="phgrid"><label class="phadd">📷<span>Ajouter</span><input type="file" accept="image/*" capture="environment" onchange="addPhoto('${id}',this)"></label></div>
   <div class="facts"><button class="add ${inTour(id)?'in':''}" onclick="toggleTour('${id}')">${inTour(id)?'✓ Tournée':'＋ Tournée'}</button><a class="map" href="${p.gmaps}" target="_blank">📍 Itinéraire</a><a class="earth" href="${earthURL(p)}" target="_blank">🌍 Earth</a><a class="ann" href="${annURL(p)}" target="_blank">🔗 Annonces</a></div>
  </div>`;
 document.getElementById('modal').classList.add('open');renderPhotos(id)}
function closeFiche(){ficheOpen=null;document.getElementById('modal').classList.remove('open')}
function refresh(){const d=filtered();drawMap(d);drawList(d);drawTour();updateTodo();renderSheet()}
// ---- DONNÉES EXTERNES (prospects.json) + repli embarqué ----
function buildIndex(){byId={};DATA.forEach(p=>byId[p.id]=p);MAX=Math.max(76,...DATA.map(p=>p.score||0));}
function populateQuartiers(){const qs=[...new Set(DATA.flatMap(p=>[p.q,p.qoff]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));const sel=document.getElementById('quart');const cur=sel.value;sel.innerHTML='<option value="all">Tous quartiers</option>'+qs.map(x=>`<option>${x}</option>`).join('');if([...sel.options].some(o=>o.value===cur))sel.value=cur;}
function boitesToday(){const t=new Date();const k=t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();return DATA.filter(p=>{const b=st(p.id).b;if(!b)return false;const d=new Date(b);return (d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())===k;}).length;}
function updateStats(){const set=(id,n,lbl)=>{const e=document.getElementById(id);if(e)e.innerHTML='<b>'+n+'</b>'+lbl;};set('st-tot',DATA.length,'prospects');set('st-star',DATA.filter(p=>p.prio).length,'⭐');set('st-chaud',DATA.filter(p=>p.tier==='chaud').length,'🔥');set('st-boite',boitesToday(),'📭 auj.');}
async function initData(){try{const r=await fetch('prospects.json',{cache:'no-store'});if(r.ok){const j=await r.json();const arr=Array.isArray(j)?j:(j&&Array.isArray(j.prospects)?j.prospects:null);if(arr&&arr.length)DATA=arr;}}catch(e){/* file:// ou hors-ligne -> repli sur FALLBACK_DATA */}
 DATA=DATA.filter(p=>!EXCLU.has(p.q)).sort((a,b)=>b.score-a.score);DATA.forEach((p,i)=>p.rang=i+1);
 buildIndex();populateQuartiers();updateStats();}
// controls
// quartiers peuplés par populateQuartiers() après chargement des données
document.getElementById('quart').onchange=e=>{fq=e.target.value;refresh()};
document.getElementById('q').oninput=e=>{q=e.target.value.trim().toLowerCase();refresh()};
document.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{const t=c.dataset.t;c.classList.toggle('on');ft.has(t)?ft.delete(t):ft.add(t);refresh()});
document.getElementById('prio').onclick=function(){prio=prio?0:1;this.classList.toggle('on');refresh()};
document.getElementById('cboite').onclick=function(){fBoite=fBoite?0:1;this.classList.toggle('on');refresh()};
document.getElementById('sort').onchange=e=>{sortMode=e.target.value;refresh()};
document.getElementById('totop').onclick=()=>list.scrollTo({top:0,behavior:'smooth'});
list.addEventListener('scroll',()=>{document.getElementById('totop').classList.toggle('show',list.scrollTop>500)});
function setView(mode){
 document.body.classList.toggle('listview',mode==='list');
 document.body.classList.toggle('splitview',mode==='split');
 document.getElementById('bmap').classList.toggle('on',mode==='map');
 document.getElementById('bmix').classList.toggle('on',mode==='split');
 document.getElementById('blist').classList.toggle('on',mode==='list');
 if(mode!=='list')setTimeout(()=>map.invalidateSize(),150);
}
document.getElementById('bmap').onclick=()=>setView('map');
document.getElementById('bmix').onclick=()=>setView('split');
document.getElementById('blist').onclick=()=>setView('list');
document.getElementById('fab').onclick=()=>{document.getElementById('sheet').classList.toggle('open');renderSheet()};
document.getElementById('sclose').onclick=()=>document.getElementById('sheet').classList.remove('open');
document.getElementById('optimize').onclick=optimize;
document.getElementById('usepos').onclick=function(){const b=this;b.textContent='⏳';
 navigator.geolocation?navigator.geolocation.getCurrentPosition(
  pos=>{startPos={lat:pos.coords.latitude,lon:pos.coords.longitude};b.textContent='✓ Ma position';refresh();fitTour()},
  ()=>{b.textContent='📍 Partir d\'ici';alert('Position indisponible (autorise la géoloc).')},{enableHighAccuracy:true,timeout:8000}):alert('Géoloc non supportée')};
document.getElementById('mbike').onclick=()=>{travelMode='bicycling';store.set('boitage13_mode','bicycling');document.getElementById('mbike').classList.add('on');document.getElementById('mscoot').classList.remove('on');renderSheet()};
document.getElementById('mscoot').onclick=()=>{travelMode='driving';store.set('boitage13_mode','driving');document.getElementById('mscoot').classList.add('on');document.getElementById('mbike').classList.remove('on');renderSheet()};
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeFiche()};
initData().then(load).then(()=>{if(travelMode==='driving'){document.getElementById('mscoot').classList.add('on');document.getElementById('mbike').classList.remove('on')}refresh()});
</script></body></html>
