<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1209">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boîtage 13">
<link rel="manifest" href="manifest.json">

<title>Cockpit Boîtage — 13ᵉ Marseille</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1209;--cream:#f8f1e4;--paper:#fffdf9;--terra:#d6552f;--terra-d:#a83d1e;
  --sun:#f0a500;--teal:#1c8b75;--line:#e8d9c4;--chaud:#df3f17;--tiede:#dd8c00;
  --froid:#62788a;--mut:#9a8878;--red:#a32d2d;
  --sh:0 2px 12px rgba(60,30,15,.12);--sh2:0 8px 32px rgba(60,30,15,.18);
  --r:16px;--r2:12px;--safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── TOP BAR ── */
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-top)) 14px 10px;z-index:1000;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.brand h1{font-family:'Fraunces',serif;font-weight:900;font-size:21px;letter-spacing:-.3px}
.brand h1 em{font-style:italic;color:var(--terra)}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid;white-space:nowrap;flex:none}
.pill.ok{background:#e2f7f0;color:#0c6e50;border-color:#a8e8d4}
.pill.sync{background:#fef3e0;color:#8a5500;border-color:#fdd888}
.pill.fail{background:#fdecea;color:var(--red);border-color:#f5b8b8}

/* stats scroll */
.stats{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:1px;margin-bottom:8px}
.stats::-webkit-scrollbar{display:none}
.stat{background:var(--cream);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.stat b{font-family:'Fraunces',serif;color:var(--terra-d);margin-right:3px;font-size:13px}

/* search row */
.srow{display:flex;gap:8px}
.search{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--cream);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:16px;min-height:48px;outline:none;transition:border-color .15s}
.search:focus{border-color:var(--terra)}
.fbtn{border:1.5px solid var(--line);background:var(--cream);border-radius:14px;padding:0 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;min-height:48px;touch-action:manipulation;transition:all .15s}
.fbtn.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* filter panel */
.panel{max-height:0;overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1)}.panel.open{max-height:260px}
.panelin{padding:10px 0 4px;display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--cream);border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;user-select:none;touch-action:manipulation;min-height:44px;display:inline-flex;align-items:center;transition:all .15s}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}.chip.sun.on{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.sel{border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:700;font-size:13px;min-height:44px}

/* banner */
#banner{display:none}
.bn{padding:11px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.bn.warn{background:#fdecea;color:var(--red)}.bn.info{background:#fef8ec;color:#7a4d00;border-bottom:1px solid #fce5b0}
.bn button{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:7px 13px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;touch-action:manipulation}
.bn button.x{border:none;padding:6px 8px;font-size:16px;margin-left:auto}

/* ── MAIN ── */
.main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:block}.scr.pad{padding:14px}
#scr-carte{padding:0}#map{position:absolute;inset:0}

/* map legend */
.legend{position:absolute;bottom:14px;left:12px;background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:11.5px;font-weight:600;z-index:600;box-shadow:var(--sh)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}

/* ── CARDS ── */
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 13px 13px 18px;margin-bottom:10px;display:flex;align-items:center;gap:11px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s;-webkit-user-select:none}
.card:active{transform:scale(.985);box-shadow:none}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:4px 0 0 4px}
.card.chaud::before{background:var(--chaud)}.card.tiede::before{background:var(--tiede)}.card.froid::before{background:var(--froid)}
.card.done{opacity:.5}
.rg{font-family:'Fraunces',serif;font-weight:900;font-size:14px;color:#c8b49e;min-width:18px;text-align:center;flex:none}
.mn{flex:1;min-width:0}
.ad{font-family:'Fraunces',serif;font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.01em}
.tag.rdv{background:#e3f4ef;color:#0d6b55}.tag.rel{background:#fdefd0;color:#9c6a08}.tag.bo{background:#f0e8f8;color:#6533a0}.tag.st{background:#f0eae0;color:#5c4d3d}
.sc{font-family:'Fraunces',serif;font-weight:900;font-size:20px;color:var(--terra-d);min-width:28px;text-align:right;flex:none}
.qcol{display:flex;flex-direction:column;gap:5px;flex:none}
.qbtn{border:1.5px solid var(--line);background:var(--cream);border-radius:11px;width:48px;height:48px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;touch-action:manipulation;transition:all .15s}
.qbtn:active{transform:scale(.9)}
.qbtn.in{background:var(--sun);border-color:var(--sun)}.qbtn.bo.on{background:#f0e8f8;border-color:#c4a0e8}

/* ── NAV BAR ── */
.nav{display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:calc(8px + var(--safe-bot));box-shadow:0 -1px 0 var(--line)}
.nav button{flex:1;border:none;background:none;padding:10px 0 6px;font-family:inherit;font-weight:600;font-size:10px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;touch-action:manipulation;transition:color .15s;letter-spacing:.02em}
.nav button .ic{font-size:22px;line-height:1;transition:transform .15s}
.nav button.on{color:var(--terra);font-weight:800}
.nav button.on .ic{transform:scale(1.1)}
.nav .bdg{position:absolute;top:6px;right:50%;margin-right:-20px;background:var(--terra);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 1px 4px rgba(214,85,47,.4)}

/* ── SECTION HEADERS ── */
.sec{font-family:'Fraunces',serif;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 2px 9px}.sec:first-child{margin-top:2px}

/* ── BUTTONS ── */
.big{width:100%;padding:15px;border:none;border-radius:14px;background:var(--teal);color:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation;min-height:52px;transition:opacity .15s,transform .1s;letter-spacing:.01em}
.big:active{opacity:.85;transform:scale(.98)}
.big.ink{background:var(--ink);color:var(--cream)}.big.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.big.terra{background:var(--terra)}

/* ── BLOCKS ── */
.block{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.block h3{font-family:'Fraunces',serif;font-weight:900;font-size:15px;margin-bottom:11px;display:flex;align-items:center;gap:6px}

/* ── TOURS ── */
.tourcard{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r2);padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.tourcard .tn{font-family:'Fraunces',serif;font-weight:900;font-size:15px}.tourcard .tmm{font-size:12px;color:var(--mut);margin-top:2px}
.trow{display:flex;gap:6px;margin-top:10px}.trow button{flex:1;border:1.5px solid var(--line);background:var(--cream);border-radius:11px;padding:12px 4px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;touch-action:manipulation;min-height:48px;transition:all .15s}
.trow button:active{background:var(--line)}
.titem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:var(--cream)}
.tnum{font-family:'Fraunces',serif;font-weight:900;color:#fff;background:var(--terra);border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.titem .ta{flex:1;font-size:13px;font-weight:600;line-height:1.3}.titem .ta small{color:var(--mut);font-weight:500;display:block;margin-top:1px}
.titem .rm{border:none;background:none;color:var(--terra-d);font-size:20px;cursor:pointer;padding:6px 8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.modeseg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.modeseg button{flex:1;border:none;background:var(--cream);padding:11px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--mut);transition:all .2s}.modeseg button.on{background:var(--teal);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px;line-height:1.5}

/* ── FICHE ── */
.fiche{position:absolute;inset:0;background:var(--cream);z-index:1500;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:none;flex-direction:column}
.fiche.show{display:flex}.fiche.open{transform:translateX(0)}
.fhead{background:var(--paper);border-bottom:1px solid var(--line);padding:calc(11px + var(--safe-top)) 13px 11px;box-shadow:var(--sh)}
.fbar{display:flex;align-items:center;gap:10px}
.back{border:1.5px solid var(--line);background:var(--cream);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none;touch-action:manipulation;display:flex;align-items:center;justify-content:center;transition:all .15s}
.back:active{background:var(--line)}
.ftt{flex:1;min-width:0}.ftt h2{font-family:'Fraunces',serif;font-weight:900;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftt .fq{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.fsc{font-family:'Fraunces',serif;font-weight:900;font-size:26px;color:var(--terra-d);flex:none}
.copyaddr{margin-top:10px;border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:12px 14px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:7px;width:100%;min-height:48px;transition:all .15s}
.copyaddr:active{background:var(--line)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.act{text-align:center;padding:11px 6px;border-radius:12px;font-weight:700;font-size:11px;border:none;font-family:inherit;cursor:pointer;text-decoration:none;touch-action:manipulation;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .15s,transform .1s;line-height:1.2}
.act:active{opacity:.8;transform:scale(.95)}
.act .ai{font-size:20px}
.act.map{background:#1a1209;color:#fff}.act.earth{background:#2d5a7a;color:#fff}.act.ann{background:var(--terra);color:#fff}.act.papers{background:#1a5c3a;color:#fff}.act.tour{background:var(--teal);color:#fff}.act.tour.in{background:var(--sun);color:var(--ink)}
.fbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.fld{margin-bottom:10px}.fld label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--cream);border-radius:12px;padding:12px 13px;font-family:inherit;font-size:16px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--terra)}
textarea.inp{resize:vertical;min-height:46px}
.two{display:flex;gap:9px}.two>div{flex:1;min-width:0}
.callrow{display:flex;gap:8px;margin-top:5px}
.cb{flex:1;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:13px;border:none;font-family:inherit;cursor:pointer;text-decoration:none;touch-action:manipulation;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,transform .1s}
.cb:active{opacity:.8;transform:scale(.97)}
.cb.tel{background:var(--teal);color:#fff}.cb.sms{background:#2d5a7a;color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{flex:1;min-width:62px;border:1.5px solid var(--line);background:var(--cream);border-radius:10px;padding:11px 4px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--mut);touch-action:manipulation;min-height:44px;transition:all .15s}
.seg button.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.note{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.note .nd{font-size:11px;color:var(--mut);font-weight:700;min-width:70px;padding-top:2px}.note .nx{font-size:13.5px;flex:1;word-break:break-word;line-height:1.4}
.note .ndel{border:none;background:none;color:var(--terra-d);cursor:pointer;font-size:16px;padding:6px 8px;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phc{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--cream)}
.phc img{width:100%;height:100%;object-fit:cover;display:block}
.phc .del{position:absolute;top:5px;right:5px;background:rgba(26,18,9,.7);color:#fff;border:none;border-radius:999px;width:26px;height:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.phadd{aspect-ratio:1;border:2px dashed var(--terra);border-radius:12px;background:#fdeee9;color:var(--terra-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12px;cursor:pointer}
.phadd input{display:none}

/* ── TOAST ── */
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-bot));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--cream);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:2000;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--sh2);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── RESPONSIVE ── */
@media(min-width:760px){
  #scr-liste.pad{column-count:2;column-gap:12px}
  #scr-liste .card{break-inside:avoid}
  .facts{grid-template-columns:repeat(5,1fr)}
}
</style></head><body>
<div class="top">
 <div class="brand"><h1>Cockpit <em>Boîtage</em> · 13ᵉ</h1><span class="pill ok" id="status">✓ Sauvegardé</span></div>
 <div class="stats" id="stats"></div>
 <div class="srow" id="srow">
  <input class="search" id="q" placeholder="🔎 rue / quartier">
  <button class="fbtn" id="fbtn">⚙︎ Filtres</button>
 </div>
 <div class="panel" id="panel"><div class="panelin">
  <span class="chip" data-t="chaud">🔥</span><span class="chip" data-t="tiede">♨️</span><span class="chip" data-t="froid">🌡️</span>
  <span class="chip sun" id="cprio">⭐</span><span class="chip" id="cboite">📭 à boîter</span><span class="chip" id="crecent">🗓️ non boîté 30j</span>
  <select class="sel" id="quart"></select>
  <select class="sel" id="sort"><option value="score">⇅ Score</option><option value="dpe">⇅ DPE récent</option><option value="quartier">⇅ Quartier</option></select>
 </div></div>
</div>
<div id="banner"></div>
<div class="main">
 <div class="scr on" id="scr-carte"><div id="map"></div>
  <div class="legend"><i style="background:var(--chaud)"></i>Chaud <i style="background:var(--tiede)"></i>Tiède <i style="background:var(--froid)"></i>Refroidi · ⭐ prio</div><button onclick="geoWatch?stopGeoWatch():startGeoWatch()" style="position:absolute;bottom:14px;right:12px;z-index:600;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:var(--sh);touch-action:manipulation" title="Ma position">📍</button>
 </div>
 <div class="scr pad" id="scr-liste"></div>
 <div class="scr pad" id="scr-tournees"></div>
 <div class="scr pad" id="scr-donnees"></div>
</div>

 <button class="on" data-s="carte"><span class="ic">🗺️</span>Carte</button>
 <button data-s="liste"><span class="ic">🏠</span>Prospects</button>

<script>
const EXCLU=new Set(['Les Olives','Les Martégaux']);
const ALLOWED_EMAILS=new Set(['rmoreau13@gmail.com']);
const EMO={chaud:'🔥',tiede:'♨️',froid:'🌡️'},TC={chaud:'#df3f17',tiede:'#dd8c00',froid:'#62788a'};
const STAT=['À visiter','Visité','Contacté','RDV','Pas vendeur','Sous mandat','Vendu'];
function now(){return new Date().toISOString()}
function $(id){return document.getElementById(id)}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}
const mem={};let localBroken=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
 set(k,v){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;if(!localBroken){localBroken=true;renderBanner()}return false}},
 del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
let DATA=[],byId={},MAX=76;
let state={},tours=[],tour=[],tourU='',travelMode='bicycling',startPos=null,phIndex={},ficheOpen=null,firstDismissed=false;
let ft=new Set(),fq='all',prio=0,q='',fBoite=0,fRecent=0,sortMode='score';
// ---- état + horodatage par enregistrement ----
function rec(id){let r=state[id];if(!r){r=state[id]={}}r.s=r.s||0;r.notes=r.notes||[];r.contact=r.contact||{};r.det=r.det||{};r.b=r.b||'';r.rdv=r.rdv||'';r.rel=r.rel||'';return r}
function touch(id){rec(id).u=now()}
function saveStateRaw(){return store.set('boitage13_v3',JSON.stringify(state))}
function saveToursRaw(){return store.set('boitage13_tours',JSON.stringify(tours))}
function saveTourRaw(){store.set('boitage13_tour',JSON.stringify(tour));store.set('boitage13_tourU',tourU)}
function saveState(){const ok=saveStateRaw();afterSave(ok)}
function saveTours(){const ok=saveToursRaw();afterSave(ok)}
function saveTour(){tourU=now();saveTourRaw();afterSave(true)}
function afterSave(localOk){if(sbUser){syncPush()}else{setStatus(localOk?'ok':'fail')}toast(localOk?'✓ Enregistré':'⚠️ Local plein — connecte-toi');if(!localOk)renderBanner()}
function setStatus(s){const e=$('status');if(!e)return;const m={ok:'✓ Sauvegardé',sync:'⏳ Synchro…',fail:'⚠️ Non sauvegardé'};e.textContent=m[s]||m.ok;e.className='pill '+(s||'ok')}
function load(){
 let raw=store.get('boitage13_v3');
 if(raw){try{state=JSON.parse(raw)}catch(e){}}
 else{let old=store.get('boitage13');if(old){try{const o=JSON.parse(old);for(const id in o){const v=o[id]||{};state[id]={s:v.s||0,b:v.b||'',rdv:'',rel:'',contact:{},det:{},notes:v.n?[{t:v.b||now(),x:v.n}]:[],u:now()}}}catch(e){}}}
 let t=store.get('boitage13_tours');if(t){try{tours=JSON.parse(t)}catch(e){}}
 let c=store.get('boitage13_tour');if(c){try{tour=JSON.parse(c)}catch(e){}}
 tourU=store.get('boitage13_tourU')||'';
 let m=store.get('boitage13_mode');if(m)travelMode=m;
 let p=store.get('boitage13_phidx');if(p){try{phIndex=JSON.parse(p)}catch(e){}}
 firstDismissed=store.get('boitage13_dismiss')==='1';
}
async function initData(){
 try{const r=await fetch('prospects.json',{cache:'no-store'});if(r.ok){const j=await r.json();const a=Array.isArray(j)?j:(j&&j.prospects);if(a&&a.length){DATA=a;store.set('boitage13_cache',JSON.stringify(a))}}}catch(e){}
 if(!DATA.length){const c=store.get('boitage13_cache');if(c){try{DATA=JSON.parse(c)}catch(e){}}}
 DATA=DATA.filter(p=>!EXCLU.has(p.q)).sort((a,b)=>b.score-a.score);DATA.forEach((p,i)=>p.rang=i+1);
 byId={};DATA.forEach(p=>byId[p.id]=p);MAX=Math.max(76,...DATA.map(p=>p.score||0));
}

function renderBanner(){const b=$('banner');let h='';
 if(localBroken)h='<div class="bn warn">⚠️ Sauvegarde locale saturée — vos saisies risquent de se perdre. Connectez-vous pour sauvegarder en ligne.<button onclick="nav(\'donnees\')">Activer</button></div>';
 else if(!sbUser&&!firstDismissed)h='<div class="bn info">🔒 Activez la sauvegarde cloud pour ne rien perdre (sur tous vos appareils).<button onclick="nav(\'donnees\')">Se connecter</button><button class="x" onclick="dismissFirst()">✕</button></div>';
 b.innerHTML=h;b.style.display=h?'block':'none'}
function dismissFirst(){firstDismissed=true;store.set('boitage13_dismiss','1');renderBanner()}
// ---- carte ----
let map,baseLayer,tourLayer;
function annURL(p){const rue=p.adresse.replace(/^\d+\s*/,'');return 'https://www.google.com/search?q='+encodeURIComponent('"'+rue+'" 13013 Marseille maison à vendre')}
function earthURL(p){return 'https://earth.google.com/web/@'+p.lat+','+p.lon+',120a,350d,35y,0h,45t,0r'}
function pappersURL(p){return 'https://immobilier.pappers.fr/?q='+encodeURIComponent(p.adresse+' 13013 Marseille')}
function initMap(){map=L.map('map',{zoomControl:true}).setView([43.345,5.432],13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 baseLayer=L.layerGroup().addTo(map);tourLayer=L.layerGroup().addTo(map)}
function drawMap(d){if(!map)return;baseLayer.clearLayers();
 d.forEach(p=>{if(p.lat==null)return;const done=rec(p.id).s>0;
  const m=L.circleMarker([p.lat,p.lon],{radius:6+p.score/MAX*8,fillColor:TC[p.tier],color:p.prio?'#f0a500':'#fff',weight:p.prio?3:1.5,fillOpacity:done?.35:.9});
  m.bindPopup('<div style="font-family:Hanken Grotesk,sans-serif"><div style="font-family:Fraunces,serif;font-weight:700;font-size:15px">'+(p.prio?'⭐ ':'')+esc(p.adresse)+'</div><div style="font-size:12px;color:#6b5b4d;margin:3px 0 6px">'+esc(p.q)+' · '+EMO[p.tier]+' DPE '+p.dpe+'/'+p.ges+' · '+p.surface+' m² · score '+p.score+'</div><a href="#" onclick="openFiche(\''+p.id+'\');return false" style="background:#241813;color:#fff;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;margin-right:5px">📋 Fiche</a><a href="#" onclick="quickBoite(\''+p.id+'\');return false" style="background:#6b3f99;color:#fff;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;margin-right:5px">📭</a><a href="#" onclick="toggleTour(\''+p.id+'\');return false" style="background:#1c8b75;color:#fff;text-decoration:none;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700">'+(inTour(p.id)?'✓':'＋')+'</a></div>');
  m.addTo(baseLayer)});
 drawTour()}
// ---- liste ----
function filtered(){const now30=Date.now()-30*86400000;let d=DATA.filter(p=>(ft.size==0||ft.has(p.tier))&&(fq=='all'||p.q==fq||p.qoff===fq)&&(!prio||p.prio)&&(!fBoite||!rec(p.id).b)&&(!fRecent||!rec(p.id).b||new Date(rec(p.id).b)<new Date(Date.now()-30*86400000))&&(!q||p.adresse.toLowerCase().includes(q)||p.q.toLowerCase().includes(q)||(p.qoff||'').toLowerCase().includes(q)));
 if(sortMode==='dpe')d=d.slice().sort((a,b)=>a.jours-b.jours);
 else if(sortMode==='quartier')d=d.slice().sort((a,b)=>(a.q||'').localeCompare(b.q||'','fr')||b.score-a.score);
 else d=d.slice().sort((a,b)=>b.score-a.score);
 return d}
function tagHTML(p){const r=rec(p.id);let h='';if(r.b)h+='<span class="tag bo">📭 boîté</span>';if(r.rdv)h+='<span class="tag rdv">📅 RDV '+fdate(r.rdv)+'</span>';if(r.rel)h+='<span class="tag rel">🔔 relance '+fdate(r.rel)+'</span>';if(r.s>0)h+='<span class="tag st">'+STAT[r.s]+'</span>';return h}
// ── Swipe sur cartes ──
function addSwipe(el, onLeft, onRight){
  let sx=0,sy=0,moved=false;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});
  el.addEventListener('touchmove',e=>{const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>12){moved=true;el.style.transform='translateX('+dx*0.4+'px)';el.style.transition='none'}},{passive:true});
  el.addEventListener('touchend',e=>{el.style.transition='transform .2s';el.style.transform='';const dx=e.changedTouches[0].clientX-sx;if(moved&&Math.abs(dx)>55){if(dx<0)onLeft();else onRight()}moved=false});
}
function bindSwipes(){document.querySelectorAll('.card').forEach(card=>{const id=card.dataset.id;if(!id)return;addSwipe(card,()=>{quickBoite(id);card.style.background='#f0e8f8'},()=>{toggleTour(id);card.style.background='#faeeda'})});}

// ── Historique boîtage ──
function getBoiteHistory(){const hist={};DATA.forEach(p=>{const b=rec(p.id).b;if(!b)return;const d=new Date(b);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');hist[k]=(hist[k]||0)+1});return hist}
function renderHistory(){const hist=getBoiteHistory();const days=[];const now=new Date();for(let i=29;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}const max=Math.max(1,...days.map(d=>hist[d]||0));const goal=parseInt(store.get('boitage13_goal')||'5');return '<div class="block"><h3>📊 Boîtages 30 derniers jours</h3><div style="display:flex;align-items:flex-end;gap:2px;height:52px;margin-bottom:6px">'+days.map(d=>{const v=hist[d]||0;const h=Math.round((v/Math.max(max,goal))*48);const isToday=d===days[days.length-1];return '<div title="'+d+' : '+v+'" style="flex:1;background:'+(isToday?'var(--terra)':'var(--teal)')+ ';height:'+h+'px;border-radius:3px 3px 0 0;min-height:'+(v>0?2:0)+'px"></div>'}).join('')+'</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:8px"><span>J-29</span><span>Aujourd'hui</span></div><div style="display:flex;gap:8px;align-items:center"><label style="font-size:12px;font-weight:700;color:var(--mut)">Objectif/jour</label><input class="inp" type="number" min="1" max="50" value="'+goal+'" style="width:70px;padding:6px 10px;font-size:15px" onchange="store.set('boitage13_goal',this.value);renderDonnees()"></div></div>'}

function smsMasse(){const stops=tourStops();if(!stops.length){toast('Aucun prospect en tournée');return}const tpl=store.get('boitage13_sms_tpl')||'Bonjour, je suis agent immobilier et je serais intéressé par votre bien situé au {adresse}. Pouvez-vous me contacter ? Rémi MOREAU - Pardo & Chartier';const nums=stops.map(p=>rec(p.id).contact?.tel).filter(Boolean);if(!nums.length){toast('Aucun numéro dans la tournée');return}const msg=tpl.replace('{adresse}','votre adresse');window.open('sms:'+nums.join(',')+'?body='+encodeURIComponent(msg));toast('📱 SMS ouvert pour '+nums.length+' contacts')}

Je suis agent immobilier et votre bien au {adresse} retient mon attention.

function drawList(d){$('scr-liste').innerHTML=d.map(p=>{const r=rec(p.id);const off=p.qoff&&p.qoff!==p.q?' · 🏛 '+esc(p.qoff):'';
 return '<div class="card '+p.tier+(r.s>0?' done':'')+'" data-id="'+p.id+'" onclick="openFiche(\''+p.id+'\')"><span class="rg">'+p.rang+'</span><div class="mn"><div class="ad">'+(p.prio?'⭐ ':'')+esc(p.adresse)+(phIndex[p.id]?' 📷':'')+'</div><div class="mt">'+esc(p.q)+' · DPE '+p.dpe+'/'+p.ges+' · '+p.surface+' m² · J-'+p.jours+off+'</div><div class="tags">'+tagHTML(p)+'</div></div><div class="sc">'+p.score+'</div><div class="qcol" onclick="event.stopPropagation()"><button class="qbtn '+(inTour(p.id)?'in':'')+'" title="Tournée" onclick="toggleTour(\''+p.id+'\')">'+(inTour(p.id)?'✓':'＋')+'</button><button class="qbtn bo '+(r.b?'on':'')+'" title="Boîté" onclick="quickBoite(\''+p.id+'\')">📭</button><button class="qbtn" title="Note" onclick="quickNote(\''+p.id+'\')">📝</button></div></div>'
 }).join('')||'<div style="padding:30px;text-align:center;color:var(--mut)">Aucun prospect 🤷</div>';requestAnimationFrame(bindSwipes)}
function quickBoite(id){const r=rec(id);r.b=r.b?'':now();touch(id);saveState();refresh();if(ficheOpen===id&&$('boitebox'))$('boitebox').innerHTML=boiteHTML(id);toast(r.b?'📭 Boîté ✓':'Boîté annulé');if(map)map.closePopup()}
function quickNote(id){const v=prompt('Note — '+byId[id].adresse+' :');if(v==null||!v.trim())return;rec(id).notes.unshift({t:now(),x:v.trim()});touch(id);saveState();refresh();toast('📝 Note ajoutée')}
// ---- stats / filtres ----
function fdate(s){if(!s)return '';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]:s}
function boitesToday(){const t=new Date(),k=t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();return DATA.filter(p=>{const b=rec(p.id).b;if(!b)return false;const d=new Date(b);return (d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())===k}).length}
function updateStats(){const tot=DATA.length,star=DATA.filter(p=>p.prio).length,chaud=DATA.filter(p=>p.tier=='chaud').length,todo=DATA.filter(p=>rec(p.id).s==0).length;
 $('stats').innerHTML='<span class="stat"><b>'+tot+'</b>prospects</span><span class="stat"><b>'+star+'</b>⭐</span><span class="stat"><b>'+chaud+'</b>🔥</span><span class="stat"><b>'+boitesToday()+'</b>📭 auj.</span><span class="stat"><b>'+todo+'</b>à visiter</span>'}
function populateQuartiers(){const qs=[...new Set(DATA.flatMap(p=>[p.q,p.qoff]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));const s=$('quart');const cur=s.value;s.innerHTML='<option value="all">Tous quartiers</option>'+qs.map(x=>'<option>'+esc(x)+'</option>').join('');if([...s.options].some(o=>o.value===cur))s.value=cur}
// ---- tournée ----
function inTour(id){return tour.includes(id)}
function toggleTour(id){const i=tour.indexOf(id);if(i<0)tour.push(id);else tour.splice(i,1);saveTour();refresh();if(map)map.closePopup();if(ficheOpen===id)syncFicheTour()}
function tourStops(){return tour.map(id=>byId[id]).filter(Boolean)}
function dist(a,b){const R=6371,r=Math.PI/180,dla=(b.lat-a.lat)*r,dlo=(b.lon-a.lon)*r;const h=Math.sin(dla/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function tourKm(){const s=tourStops();let pts=startPos?[startPos,...s]:s,d=0;for(let i=1;i<pts.length;i++)d+=dist(pts[i-1],pts[i]);return d}
function optimize(){let s=tourStops();if(s.length<2)return;let cur=startPos||s[0],pool=startPos?[...s]:s.slice(1),ord=startPos?[]:[s[0]];while(pool.length){let bi=0,bd=1e9;pool.forEach((p,i)=>{const d=dist(cur,p);if(d<bd){bd=d;bi=i}});cur=pool[bi];ord.push(cur);pool.splice(bi,1)}tour=ord.map(p=>p.id);saveTour();renderTours();drawTour();fitTour()}
function mapsUrl(){const s=tourStops();if(!s.length)return '#';let pts=startPos?[startPos,...s]:s;if(pts.length<2)return 'https://www.google.com/maps/dir/?api=1&destination='+pts[0].lat+','+pts[0].lon+'&travelmode='+travelMode;const o=pts[0],d=pts[pts.length-1],wp=pts.slice(1,-1).map(p=>p.lat+','+p.lon).join('|');let u='https://www.google.com/maps/dir/?api=1&travelmode='+travelMode+'&origin='+o.lat+','+o.lon+'&destination='+d.lat+','+d.lon;if(wp)u+='&waypoints='+encodeURIComponent(wp);return u}
function fitTour(){const s=tourStops();if(!s.length||!map)return;const ll=s.map(p=>[p.lat,p.lon]);if(startPos)ll.unshift([startPos.lat,startPos.lon]);if($('scr-carte').classList.contains('on'))map.fitBounds(ll,{padding:[50,50],maxZoom:15})}
function drawTour(){if(!tourLayer)return;tourLayer.clearLayers();const s=tourStops();if(!s.length)return;let pts=startPos?[startPos,...s]:s;const ll=pts.map(p=>[p.lat,p.lon]);
 L.polyline(ll,{color:'#d6552f',weight:4,opacity:.85,dashArray:'7 7'}).addTo(tourLayer);
 if(startPos)L.circleMarker([startPos.lat,startPos.lon],{radius:7,fillColor:'#1c8b75',color:'#fff',weight:2,fillOpacity:1}).bindTooltip('Départ').addTo(tourLayer);
 s.forEach((p,i)=>L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div style="background:#d6552f;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(tourLayer))}
function renderTours(){const s=tourStops();const n=tour.length;$('navbdg').style.display=n?'flex':'none';$('navbdg').textContent=n;const saved=tours.filter(t=>!t.deleted);
 let h='<div class="sec">Tournée en cours</div>';
 if(!s.length)h+='<div class="block"><p class="hint" style="margin:0">Ajoutez des adresses avec le bouton ＋ (liste ou carte) pour bâtir une tournée.</p></div>';
 else{h+='<div class="block"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-family:Fraunces,serif">'+s.length+' arrêt'+(s.length>1?'s':'')+'</b><span style="font-family:Fraunces,serif;font-weight:700;color:var(--terra-d)">≈ '+tourKm().toFixed(1)+' km</span></div>';
  h+=s.map((p,i)=>'<div class="titem"><span class="tnum">'+(i+1)+'</span><div class="ta">'+esc(p.adresse)+'<br><small>'+esc(p.q)+' · '+EMO[p.tier]+' '+p.dpe+'</small></div><button class="rm" onclick="toggleTour(\''+p.id+'\')">✕</button></div>').join('');
  h+='<div class="modeseg" style="margin:10px 0"><button class="'+(travelMode==='bicycling'?'on':'')+'" onclick="setMode(\'bicycling\')">🚲 Vélo</button><button class="'+(travelMode==='driving'?'on':'')+'" onclick="setMode(\'driving\')">🛵 Scooter</button></div>';
  h+='<div class="trow"><button onclick="usePos()">📍 Partir d\'ici</button><button onclick="optimize()">↘️ Optimiser</button></div>';
  h+='<a class="big terra" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="'+mapsUrl()+'" target="_blank">Ouvrir dans Google Maps</a><button class="big" style="background:#2d5a7a;margin-top:8px" onclick="smsMasse()">💬 SMS en masse à la tournée</button>';
  h+='<button class="big ghost" style="margin-top:8px" onclick="saveCurrentTour()">💾 Enregistrer cette tournée</button></div>'}
 h+='<div class="sec">Tournées enregistrées</div>';
 if(!saved.length)h+='<div class="block"><p class="hint" style="margin:0">Aucune tournée enregistrée.</p></div>';
 else h+=saved.map(t=>'<div class="tourcard"><div class="tn">🧭 '+esc(t.name)+'</div><div class="tmm">'+esc(t.date)+' · '+t.stops.length+' arrêt'+(t.stops.length>1?'s':'')+'</div><div class="trow"><button onclick="openTourSaved(\''+t.id+'\')">Charger</button><button onclick="dupTour(\''+t.id+'\')">Dupliquer</button><a class="big ghost" style="flex:1;padding:9px 4px;font-size:12px" href="'+tourMapsUrl(t)+'" target="_blank">Maps</a><button onclick="delTour(\''+t.id+'\')">🗑️</button></div></div>').join('');
 $('scr-tournees').innerHTML=h}
function setMode(m){travelMode=m;store.set('boitage13_mode',m);saveTour();renderTours()}
function usePos(){if(!navigator.geolocation){alert('Géoloc non supportée');return}toast('Localisation…');navigator.geolocation.getCurrentPosition(pos=>{startPos={lat:pos.coords.latitude,lon:pos.coords.longitude};toast('Position prise');renderTours();drawTour();fitTour()},()=>alert('Position indisponible (autorisez la géoloc).'),{enableHighAccuracy:true,timeout:8000})}
function tourMapsUrl(t){const s=t.stops.map(id=>byId[id]).filter(Boolean);if(!s.length)return '#';if(s.length<2)return 'https://www.google.com/maps/dir/?api=1&destination='+s[0].lat+','+s[0].lon;const o=s[0],d=s[s.length-1],wp=s.slice(1,-1).map(p=>p.lat+','+p.lon).join('|');let u='https://www.google.com/maps/dir/?api=1&origin='+o.lat+','+o.lon+'&destination='+d.lat+','+d.lon;if(wp)u+='&waypoints='+encodeURIComponent(wp);return u}
function saveCurrentTour(){if(!tour.length)return;const nm=prompt('Nom de la tournée :','Tournée '+new Date().toLocaleDateString('fr-FR'));if(nm===null)return;tours.unshift({id:'t'+Date.now(),name:nm||'Tournée',date:new Date().toLocaleDateString('fr-FR'),stops:[...tour],u:now()});saveTours();renderTours();toast('💾 Tournée enregistrée')}
function openTourSaved(id){const t=tours.find(x=>x.id===id);if(!t)return;tour=[...t.stops];saveTour();refresh();toast('Tournée chargée')}
function dupTour(id){const t=tours.find(x=>x.id===id);if(!t)return;tours.unshift({id:'t'+Date.now(),name:t.name+' (copie)',date:new Date().toLocaleDateString('fr-FR'),stops:[...t.stops],u:now()});saveTours();renderTours()}
function delTour(id){if(!confirm('Supprimer cette tournée ?'))return;const t=tours.find(x=>x.id===id);if(t){t.deleted=true;t.u=now()}saveTours();renderTours()}
// ---- photos (IndexedDB) ----
let _db=null;
function idb(){return new Promise((res,rej)=>{if(_db)return res(_db);let r;try{r=indexedDB.open('boitage13',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>{r.result.createObjectStore('photos')};r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
function idbGet(id){return idb().then(db=>new Promise(res=>{const t=db.transaction('photos','readonly').objectStore('photos').get(id);t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([])})).catch(()=>[])}
function idbSet(id,arr){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(arr,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})).catch(()=>false)}
function idbAll(){return idb().then(db=>new Promise(res=>{const out={};const c=db.transaction('photos','readonly').objectStore('photos').openCursor();c.onsuccess=e=>{const cu=e.target.result;if(cu){out[cu.key]=cu.value;cu.continue()}else res(out)};c.onerror=()=>res(out)})).catch(()=>({}))}
async function migratePhotos(){let keys=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('ph_')===0)keys.push(k)}}catch(e){}let moved=0;for(const k of keys){try{const arr=JSON.parse(localStorage.getItem(k));if(await idbSet(k.slice(3),arr)){localStorage.removeItem(k);moved++}}catch(e){}}if(moved){localBroken=false;renderBanner()}}
function downscale(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);try{cb(c.toDataURL('image/jpeg',.6))}catch(e){cb(fr.result)}};img.src=fr.result};fr.readAsDataURL(file)}

');const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prospects-13-'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('📊 Export CSV prêt')}
